name: 🍇 葡萄大模型日课

on:
  schedule:
    # 北京时间 03:00 = UTC 前一天 19:00
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: '手动指定时段（3/12/18）'
        required: false
        default: '3'

jobs:
  push-knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx

      - name: 推送知识卡片
        env:
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET:  ${{ secrets.DINGTALK_SECRET }}
          GITHUB_TOKEN:     ${{ secrets.GRAPE_DATA_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOT="${{ github.event.inputs.slot }}"
          else
            SLOT="3"
          fi
          echo "使用时段: ${SLOT}"
          python knowledge_push.py "${SLOT}"

      - name: 提交进度更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add progress.json module_alerts.json
          git diff --staged --quiet || git commit -m "📊 更新学习进度 $(date '+%Y-%m-%d %H:%M UTC')"
          git push
